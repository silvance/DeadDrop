[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deaddrop"
version = "0.1.0"
description = "Reticulum/LoRA dead-drop message store and client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DeadDrop contributors" }]
keywords = ["reticulum", "lora", "mesh", "dead-drop", "covert"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: System :: Networking",
]
dependencies = [
    "rns>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[project.scripts]
deaddrop = "deaddrop.cli:client_main"
deaddrop-node = "deaddrop.cli:node_main"

[project.urls]
Repository = "https://github.com/silvance/deaddrop"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deaddrop = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
